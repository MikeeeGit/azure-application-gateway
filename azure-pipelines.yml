# Azure Repos PR checks are enforced by build-validation policies.
trigger:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
pr:
  branches:
    include: [main, develop]
  paths:
    exclude: ["*.md", "**/*.md"]
resources:
  repositories:
    - repository: deliveryTemplates
      type: git
      name: terraform-delivery-templates
      ref: 281d779aced9c6e7da082b5e57c85639dc1858df
jobs:
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: FreshHttpsInstallation
      directory: .
      testDirectory: tests/https-first
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
        examples/https-first/https.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: TerraformRoot
      directory: .
      testDirectory: tests
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_uks_pprd
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_1
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        examples/basic/basic.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_2
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        examples/complete/complete.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: IngressCandidate
      directory: .
      testDirectory: tests/ingress-candidate
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
        examples/ingress-tls/candidate.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: IngressTlsCutover
      directory: .
      testDirectory: tests/ingress-tls
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
        examples/ingress-tls/backend.tfvars
